name: Autonomy Lifecycle Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas_autonomy*.py'
      - 'main.py'
      - 'scripts/patch_main_autonomy.py'
      - 'tests/test_autonomy*.py'
      - '.github/workflows/autonomy-lifecycle.yml'
  workflow_dispatch:

jobs:
  verify-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded lifecycle patch in CI workspace
        run: python scripts/patch_main_autonomy.py
      - name: Compile changed runtime
        run: python -m py_compile main.py atlas_autonomy.py atlas_autonomy_store.py atlas_autonomy_workers.py atlas_autonomy_runtime.py
      - name: Verify lifecycle contract
        run: python -m unittest tests.test_main_autonomy_contract

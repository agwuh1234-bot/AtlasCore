name: Autonomy Operations Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ops-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_autonomy_operations

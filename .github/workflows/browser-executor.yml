name: Browser Executor

on:
  pull_request:
    branches: [main]
  push:
    branches: [atlas/browser-executor-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Run Browser Executor unit tests
        run: python -m unittest discover -s tests -p 'test_browser_executor.py' -v
      - name: Browser smoke test
        run: |
          python - <<'PY'
          import asyncio
          from atlas_browser_executor import BrowserExecutor

          async def main():
              result = await BrowserExecutor().run(
                  start_url='https://example.com',
                  actions=[{'type': 'extract', 'selector': 'body'}, {'type': 'screenshot'}],
              )
              assert result.ok, result.error
              assert 'Example Domain' in result.text
              assert result.artifacts
              print(result.public())

          asyncio.run(main())
          PY

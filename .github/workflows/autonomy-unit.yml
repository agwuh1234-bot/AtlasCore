name: Autonomy Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas_autonomy*.py'
      - 'tests/test_autonomy*.py'
      - 'tests/test_patch_main_autonomy.py'
      - 'scripts/patch_main_autonomy.py'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project requirements
        run: pip install -r requirements.txt
      - name: Run autonomy tests
        run: python -m unittest discover -s tests -p 'test_autonomy*.py'
      - name: Test guarded patch failure mode
        run: python -m unittest tests.test_patch_main_autonomy

name: Autonomy PR Body Final

on:
  pull_request:
    branches: [main]

jobs:
  body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_autonomy_pr_body_final

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="apple-touch-icon" href="/app/icon-192.png" />
    <title>ATLAS</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <div class="brand">ATLAS</div>
          <div class="status"><span class="dot"></span> Core online</div>
        </div>
      </header>

      <main id="chat" class="chat" aria-live="polite"></main>

      <form id="composer" class="composer">
        <textarea id="message" rows="1" placeholder="Напиши сообщение…" autocomplete="off" autocapitalize="sentences"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>

    <script src="/app/app.js"></script>
  </body>
</html>

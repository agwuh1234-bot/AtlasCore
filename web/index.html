<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>ATLAS</title>
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/app/manifest.json">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">ATLAS</div>
        <div class="status"><span class="dot"></span><span id="statusText">offline</span></div>
      </div>
      <div class="topbar-actions">
        <button id="newChat" class="topbar-btn" type="button" aria-label="Новый чат">Новый чат</button>
        <button id="settings" class="topbar-btn ghost" type="button" aria-label="Настройки">Настройки</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section class="welcome-state" aria-label="Приветствие">
        <h1>Atlas App</h1>
        <p>Начни новый чат или открой настройки для доступа.</p>
      </section>
    </main>

    <div class="composer-wrap">
      <form id="composer" class="composer">
        <button id="voiceBtn" class="voice-btn" type="button" aria-label="Микрофон">🎤</button>
        <textarea id="message" rows="1" placeholder="Напиши сообщение…" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
        <button id="send" class="send" type="submit" aria-label="Отправить">↑</button>
      </form>
    </div>
  </div>

  <div id="keyModal" class="modal-bg" style="display:none" aria-hidden="true">
    <div class="modal">
      <h2>Ключ доступа</h2>
      <p>Введите ключ, чтобы продолжить.</p>
      <input id="keyInput" type="password" autocomplete="off" inputmode="text" placeholder="Access key" />
      <div class="modal-actions">
        <button id="saveKey" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Atlas</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand">Atlas</div>
        <div class="presence"><span class="dot"></span><span id="serviceStatus">offline</span></div>
      </div>
      <button id="newChatBtn" class="ghost-btn" type="button">Новый чат</button>
    </header>

    <main class="main">
      <section id="loginCard" class="card login-card">
        <h1>Atlas</h1>
        <p>Вход в мобильный интерфейс.</p>
        <label class="field">
          <span>Пароль</span>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Введите пароль">
        </label>
        <button id="loginBtn" class="primary-btn" type="button">Войти</button>
        <div id="loginError" class="error" aria-live="polite"></div>
      </section>

      <section id="chatCard" class="card chat-card hidden">
        <div id="chatList" class="chat-list" aria-live="polite"></div>
      </section>
    </main>

    <footer id="composerWrap" class="composer-wrap hidden">
      <form id="composer" class="composer">
        <textarea id="messageInput" rows="1" placeholder="Напиши сообщение…"></textarea>
        <button id="sendBtn" class="send-btn" type="submit">→</button>
      </form>
      <div class="hint">Enter — отправить, Shift+Enter — новая строка</div>
    </footer>
  </div>
  <script src="/app/app.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/styles.css">
  <title>Atlas</title>
</head>
<body>
  <div class="app app-shell">
    <header class="topbar">
      <div>
        <div class="brand">Atlas</div>
        <div class="presence"><span class="dot"></span><span id="serviceStatus">offline</span></div>
      </div>
      <div class="topbar-actions">
        <button id="installBtn" class="ghost-btn" type="button">Установить</button>
        <button id="newChatBtn" class="ghost-btn" type="button">Новый чат</button>
      </div>
    </header>

    <div id="loginCard" class="modal-bg">
      <div class="modal">
        <h1>Atlas</h1>
        <p>Введите ключ приложения, чтобы продолжить.</p>
        <label for="passwordInput">Ключ приложения</label>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Введите ключ">
        <button id="loginBtn" type="button">Войти</button>
        <div id="loginError" aria-live="polite"></div>
      </div>
    </div>

    <div id="installCard" class="modal-bg hidden">
      <div class="modal">
        <h2>Установить Atlas</h2>
        <p>На iPhone: нажмите «Поделиться» → «На экран Домой», оставьте «Открывать как веб-приложение» включённым и нажмите «Добавить».</p>
        <button id="closeInstallBtn" type="button">Понятно</button>
      </div>
    </div>

    <section id="chatCard" class="chat-card hidden">
      <div id="chatList" class="chat-list" aria-live="polite"></div>
    </section>

    <footer id="composerWrap" class="composer-wrap hidden">
      <form id="composer" class="composer">
        <button id="voiceBtn" type="button" class="icon-btn" aria-label="Voice input">🎤</button>
        <textarea id="messageInput" rows="1" placeholder="Напиши Atlas…"></textarea>
        <button id="sendBtn" class="send" type="submit">→</button>
      </form>
    </footer>
  </div>
  <script src="/app/app.js" defer></script>
</body>
</html>

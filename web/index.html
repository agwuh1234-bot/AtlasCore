<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app/icon.svg">
  <link rel="stylesheet" href="/app/styles.css">
  <title>Atlas</title>
</head>
<body>
  <div class="app app-shell">
    <header class="topbar">
      <div>
        <div class="brand">Atlas</div>
        <div class="presence"><span class="dot"></span><span id="serviceStatus">offline</span></div>
      </div>
      <button id="newChatBtn" class="ghost-btn" type="button">New chat</button>
    </header>

    <div id="loginCard" class="modal-bg">
      <div class="modal">
        <h1>Atlas</h1>
        <p>Enter the app key to continue.</p>
        <label for="passwordInput">App key</label>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter key">
        <button id="loginBtn" type="button">Continue</button>
        <div id="loginError" aria-live="polite"></div>
      </div>
    </div>

    <section id="chatCard" class="chat-card hidden">
      <div id="chatList" class="chat-list" aria-live="polite"></div>
    </section>

    <footer id="composerWrap" class="composer-wrap hidden">
      <form id="composer" class="composer">
        <textarea id="messageInput" rows="1" placeholder="Message Atlas…"></textarea>
        <button id="sendBtn" class="send" type="submit">→</button>
      </form>
    </footer>
  </div>
  <script src="/app/app.js" defer></script>
</body>
</html>

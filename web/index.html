<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ATLAS</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">ATLAS</div>
      <div class="status"><span class="dot"></span><span id="statusText">Готов</span></div>
      <div class="actions">
        <button id="newChat" type="button" aria-label="Новый чат">＋</button>
        <button id="settings" type="button" aria-label="Настройки">⚙</button>
      </div>
    </header>

    <main id="chat" class="chat"></main>

    <div class="composer-wrap">
      <form id="composer" class="composer">
        <textarea id="message" placeholder="Напиши Atlas…"></textarea>
        <button id="send" class="send" type="submit">↑</button>
      </form>
    </div>
  </div>

  <div id="keyModal" style="display:none;">
    <div class="modal">
      <h2>Ключ доступа</h2>
      <p>Ключ хранится только на этом устройстве.</p>
      <input id="keyInput" type="password" />
      <button id="saveKey" type="button">Сохранить</button>
    </div>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>

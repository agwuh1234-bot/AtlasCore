<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ATLAS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>ATLAS</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="settings" class="icon-btn ghost" type="button" aria-label="Настройки">⚙</button>
      <div class="brand-block">
        <div class="brand">ATLAS</div>
        <div class="status"><span class="dot"></span><span id="statusText">offline</span></div>
      </div>
      <button id="newChat" class="icon-btn" type="button" aria-label="Новый чат">＋</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="emptyState" class="empty">
        <div class="empty-logo">A</div>
        <h1>Atlas ready</h1>
        <p>Напиши сообщение, чтобы начать новый диалог.</p>
      </section>
    </main>

    <div class="composer-wrap">
      <form id="composer" class="composer">
        <textarea id="message" rows="1" placeholder="Напиши Atlas…" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
        <button id="send" class="send" type="submit" aria-label="Отправить">↑</button>
      </form>
    </div>
  </div>

  <div id="settingsModal" class="modal-bg hidden" aria-hidden="true">
    <div class="modal">
      <h2>Настройки</h2>
      <p>Ключ хранится только на этом устройстве.</p>
      <input id="keyInput" type="password" autocomplete="off" inputmode="text" placeholder="Atlas access key" />
      <div class="modal-actions">
        <button id="saveKey" type="button">Сохранить</button>
        <button id="closeSettings" type="button" class="secondary">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>

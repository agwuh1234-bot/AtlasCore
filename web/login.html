<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05070a">
<title>Atlas Login</title>
<link rel="stylesheet" href="/app/login.css?v=20260827-1728">
</head>
<body>
<main class="card" id="card">
<h1>Atlas</h1>
<p class="sub">Безопасный вход. Введите ключ приложения.</p>
<form id="loginForm" autocomplete="on">
<label for="key">Ключ приложения</label>
<input id="key" name="key" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Введите ключ" required>
<button id="submit" type="submit">Войти</button>
<div id="error" class="error" role="alert" aria-live="polite"></div>
</form>
<div class="hint">Страница входа работает отдельно от интерфейса Atlas и совместима с Safari/iPad.</div>
</main>
<script src="/app/login.js?v=20260827-1728" defer></script>
</body>
</html>

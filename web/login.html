<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05070a">
<title>Atlas Login</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#05070a;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));overflow:auto}
.card{width:min(100%,480px);background:#0d121b;border:1px solid #273142;border-radius:24px;padding:28px;box-shadow:0 24px 80px #0008;position:relative;z-index:2147483647;pointer-events:auto!important;touch-action:manipulation}
h1{margin:0 0 10px;font-size:38px;letter-spacing:-.03em}.sub{margin:0 0 26px;color:#9aa6b6;font-size:17px;line-height:1.45}
label{display:block;margin:0 0 9px;font-size:15px;font-weight:650}
input{display:block;width:100%;height:58px;border:1px solid #303a4b;border-radius:15px;background:#06090e;color:#fff;padding:0 16px;font:inherit;font-size:18px;outline:none;-webkit-appearance:none;appearance:none;pointer-events:auto!important;touch-action:manipulation;user-select:text;-webkit-user-select:text}
input:focus{border-color:#755cff;box-shadow:0 0 0 3px #755cff2b}
button{display:block;width:100%;height:56px;margin-top:16px;border:0;border-radius:15px;background:#7457f5;color:#fff;font:inherit;font-weight:800;font-size:17px;pointer-events:auto!important;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:disabled{opacity:.55}.error{min-height:24px;margin-top:12px;color:#ff7b82;font-size:14px}.hint{margin-top:16px;color:#788596;font-size:13px;line-height:1.45}
</style>
</head>
<body>
<main class="card" id="card">
<h1>Atlas</h1>
<p class="sub">Безопасный вход. Введите ключ приложения.</p>
<form id="loginForm" autocomplete="on">
<label for="key">Ключ приложения</label>
<input id="key" name="key" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Введите ключ" required>
<button id="submit" type="submit">Войти</button>
<div id="error" class="error" role="alert" aria-live="polite"></div>
</form>
<div class="hint">Эта страница специально не загружает интерфейс Atlas, панели или PWA-скрипты, чтобы поле гарантированно работало на iPad/Safari.</div>
</main>
<script>
(()=>{'use strict';
const form=document.getElementById('loginForm'),input=document.getElementById('key'),button=document.getElementById('submit'),error=document.getElementById('error');
const focusInput=()=>{try{input.focus({preventScroll:true})}catch{try{input.focus()}catch{}}};
input.addEventListener('pointerdown',()=>setTimeout(focusInput,0),{passive:true});
input.addEventListener('touchend',()=>setTimeout(focusInput,0),{passive:true});
form.addEventListener('submit',async e=>{e.preventDefault();const key=input.value.trim();if(!key){error.textContent='Введите ключ';focusInput();return}button.disabled=true;error.textContent='';try{const r=await fetch('/app-login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({key})});if(r.status===401){error.textContent='Неверный ключ';input.select();return}if(!r.ok){error.textContent='Ошибка входа: '+r.status;return}const s=await fetch('/app-session?login_check='+Date.now(),{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).catch(()=>({}));if(!s.authenticated){error.textContent='Сессия не сохранилась. Откройте страницу в Safari.';return}location.replace('/?atlas_login='+Date.now())}catch(err){error.textContent='Нет соединения с Atlas'}finally{button.disabled=false}});
})();
</script>
</body>
</html>
